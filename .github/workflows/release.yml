name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Automated Tests
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish Standalone Executable
        run: |
          dotnet publish src/PSS790Player/PSS790Player.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish_output

      - name: Package Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item src/PSS790Player/Launch-PSS790.bat publish_output/
          Copy-Item ASUS_ROG_ALLY_SETUP.txt publish_output/
          Copy-Item publish_output/PSS790Player.exe release_assets/
          Copy-Item src/PSS790Player/Launch-PSS790.bat release_assets/
          Copy-Item ASUS_ROG_ALLY_SETUP.txt release_assets/
          Compress-Archive -Path publish_output/* -DestinationPath release_assets/PSS790Player-win-x64.zip

      - name: Extract Release Notes from Changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $content = [System.IO.File]::ReadAllText("CHANGELOG.md", [System.Text.Encoding]::UTF8)
          $pattern = "(?s)## \[$tag\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\Z)"
          if ($content -match $pattern) {
              $notes = $matches[1].Trim()
          } else {
              $notes = "### Release ${{ github.ref_name }}`n`nStandalone executable build for Yamaha PSS-790 MIDI Player & Remapper."
          }
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            release_assets/PSS790Player.exe
            release_assets/Launch-PSS790.bat
            release_assets/ASUS_ROG_ALLY_SETUP.txt
            release_assets/PSS790Player-win-x64.zip
