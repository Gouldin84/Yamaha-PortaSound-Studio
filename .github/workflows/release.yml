name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Automated Tests
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish Standalone Executable
        run: |
          dotnet publish src/PSS790Player/PSS790Player.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish_output

      - name: Package Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item Launch-Studio.bat publish_output/
          Copy-Item ASUS_ROG_ALLY_SETUP.txt publish_output/
          Copy-Item publish_output/PSS-Studio.exe release_assets/
          Copy-Item Launch-Studio.bat release_assets/
          Copy-Item ASUS_ROG_ALLY_SETUP.txt release_assets/
          Compress-Archive -Path publish_output/* -DestinationPath release_assets/PSS-Studio-win-x64.zip
          Copy-Item release_assets/* dist/

      - name: Generate Release Notes Summary
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $summary = @"
# Yamaha PortaSound Studio v${tag}

A high-performance standalone MIDI workstation, real-time voice remapper, and multi-tab recording & SysEx studio designed for the **Yamaha PortaSound PSS-790** (AWM) and **PSS-680 / PSS-480 / PSS-780** (2-Operator FM) keyboard synthesizers.

## Key Features & New Functionality in v${tag}
* **Yamaha PSS-680 / PSS-480 / PSS-780 FM Synthesis Support**:
  - Full support for the vintage 2-operator FM sound engine (YM3420 / OPLL derivative) alongside the PSS-790 AWM engine.
  - Multi-timbral Sound Source Mode 99 support with dynamic 12-voice polyphony allocation and full velocity sensitivity (1-127).
* **Interactive Synthesizer Model Selector**:
  - Header dropdown with custom photorealistic 3D isometric icons allowing on-the-fly switching between PSS-790 (AWM) and PSS-680 (FM).
  - Mixer strips dynamically adapt voice overrides to the active model's 100 preset voices.
* **Complete Preset & Drum Engine Mappings**:
  - 100 PSS-680 FM Preset Voices (#00-#99) and 100 Rhythm Styles (#00-#99).
  - 32-Drum Hand Percussion & Custom Drummer translation on MIDI Channel 16.
* **Full System Exclusive (SysEx) Engine**:
  - Format 00H (FM 2-Operator Voice Data single bank dumps) exposing deep synthesizer parameters.
  - Format 01H (Melody Memory 5 Banks), Format 02H (Chord Memory), and Format 03H (Rhythm Pattern / Custom Drummer).
  - Verified 7-bit two's complement checksum calculation and high-nibble-first transmission.
* **Renamed Standalone Executable to PSS-Studio.exe**:
  - Fully self-contained standalone executable ready for Windows 10/11 x64 with zero runtime dependencies.
  - Added 1-click `build.bat` and `Launch-Studio.bat`.

## Downloads
| Asset | Description |
| :--- | :--- |
| **PSS-Studio.exe** | Standalone single-file executable (no installation or .NET runtime required) |
| **PSS-Studio-win-x64.zip** | Complete package archive with executable, launcher, and Asus ROG Ally setup guide |
| **Launch-Studio.bat** | Windows launch script |

## Quick Start Guide
1. Download **`PSS-Studio.exe`** (or extract **`PSS-Studio-win-x64.zip`**).
2. Connect your PC's USB-MIDI Interface to your Yamaha PortaSound keyboard (`OUT` to `MIDI IN`, `IN` to `MIDI OUT`).
3. Run `PSS-Studio.exe`, select your keyboard model (**PSS-790** or **PSS-680**) from the top header dropdown, and choose your MIDI port.
"@
          [System.IO.File]::WriteAllText("release_notes.md", $summary, [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Yamaha PortaSound Studio ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            release_assets/PSS-Studio.exe
            release_assets/Launch-Studio.bat
            release_assets/ASUS_ROG_ALLY_SETUP.txt
            release_assets/PSS-Studio-win-x64.zip
