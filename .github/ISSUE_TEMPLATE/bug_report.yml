name: 🐛 Bug Report
description: Report unexpected behavior, crashes, or playback glitches.
title: "[Bug]: <Short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide clear steps to reproduce the issue.

  - type: dropdown
    id: active_model
    attributes:
      label: Active Synthesizer Model
      options:
        - Yamaha PSS-790
        - Yamaha PSS-680
        - Both / General UI
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: Check the version shown at the bottom of the sidebar or in window title.
      placeholder: e.g. v2.6.12
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open Tab '...'
        2. Load song '...'
        3. Click '...'
        4. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Screenshots
      description: Drag and drop screenshots, error logs, or attach the MIDI file if applicable.
