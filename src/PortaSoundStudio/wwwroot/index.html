<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yamaha PortaSound Studio</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link href="css/tailwind.css?v=3.1.1" rel="stylesheet" />
    <link href="css/styles.css?v=3.1.1" rel="stylesheet" />

            <div class="text-center space-y-1">
